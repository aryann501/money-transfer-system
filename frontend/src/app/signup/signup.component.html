<div class="auth-container">
  <!-- Decorative Background Elements -->
  <div class="bg-decoration decoration-1"></div>
  <div class="bg-decoration decoration-2"></div>
  <div class="bg-decoration decoration-3"></div>

  <div class="auth-card">
    <div class="card-header">
      <div class="logo">
        <img src="assets/signup.png" alt="App Logo" />
      </div>
      <h2>Create Your Account</h2>
      <p class="subtitle">Fill in the details to get started</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <div class="form-group" [class.has-error]="signupForm.get('username')?.touched && signupForm.get('username')?.invalid">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            id="username"
            type="text"
            formControlName="username" 
            placeholder="Enter your username" 
          />
        </div>
        <div class="error" *ngIf="signupForm.get('username')?.touched && signupForm.get('username')?.invalid">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <small *ngIf="signupForm.get('username')?.errors?.['required']">Username is required</small>
          <small *ngIf="signupForm.get('username')?.errors?.['minlength']">Minimum 3 characters required</small>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group" [class.has-error]="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            id="password"
            type="password" 
            formControlName="password" 
            placeholder="Enter your password" 
          />
        </div>
        <div class="error" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <small *ngIf="signupForm.get('password')?.errors?.['required']">Password is required</small>
          <small *ngIf="signupForm.get('password')?.errors?.['minlength']">Minimum 6 characters required</small>
        </div>
      </div>

      <!-- Holder Name -->
      <div class="form-group" [class.has-error]="signupForm.get('holderName')?.touched && signupForm.get('holderName')?.invalid">
        <label for="holderName">Account Holder Name</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            id="holderName"
            type="text"
            formControlName="holderName" 
            placeholder="Enter account holder name" 
          />
        </div>
        <div class="error" *ngIf="signupForm.get('holderName')?.touched && signupForm.get('holderName')?.invalid">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <small>Account holder name is required</small>
        </div>
      </div>

      <!-- Min Balance -->
      <div class="form-group" [class.has-error]="signupForm.get('minBalance')?.touched && signupForm.get('minBalance')?.invalid">
        <label for="minBalance">Minimum Balance</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <input 
            id="minBalance"
            type="number"
            formControlName="minBalance" 
            placeholder="Minimum balance (≥1000)" 
          />
        </div>
        <div class="error" *ngIf="signupForm.get('minBalance')?.touched && signupForm.get('minBalance')?.invalid">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <small *ngIf="signupForm.get('minBalance')?.errors?.['required']">Balance is required</small>
          <small *ngIf="signupForm.get('minBalance')?.errors?.['min']">Minimum balance must be 1000</small>
        </div>
      </div>

      <button type="submit" class="signup-btn" [disabled]="signupForm.invalid">
        <span class="btn-text">Create Account</span>
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </button>

      <!-- Error message for signup failures -->
      <div class="error-message" *ngIf="errorMessage">
        <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    </form>

    <div class="divider">
      <span>or</span>
    </div>

    <p class="login-link">
      Already have an account? <a routerLink="/login">Sign In</a>
    </p>
  </div>
</div>
