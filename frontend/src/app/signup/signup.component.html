<div class="auth-container">
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <h2>Sign Up</h2>

    <div class="form-group">
      <input formControlName="username" placeholder="Username" />
      <div class="error" *ngIf="signupForm.get('username')?.touched && signupForm.get('username')?.invalid">
        <small *ngIf="signupForm.get('username')?.errors?.['required']">Username is required.</small>
        <small *ngIf="signupForm.get('username')?.errors?.['minlength']">Minimum 3 characters.</small>
      </div>
    </div>

    <div class="form-group">
      <input type="password" formControlName="password" placeholder="Password" />
      <div class="error" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
        <small *ngIf="signupForm.get('password')?.errors?.['required']">Password is required.</small>
        <small *ngIf="signupForm.get('password')?.errors?.['minlength']">Minimum 6 characters.</small>
      </div>
    </div>

    <div class="form-group">
      <input formControlName="holderName" placeholder="Account Holder Name" />
      <div class="error" *ngIf="signupForm.get('holderName')?.touched && signupForm.get('holderName')?.invalid">
        <small>Holder name is required.</small>
      </div>
    </div>

    <div class="form-group">
      <input type="number" formControlName="minBalance" placeholder="Minimum Balance (>=1000)" />
      <div class="error" *ngIf="signupForm.get('minBalance')?.touched && signupForm.get('minBalance')?.invalid">
        <small *ngIf="signupForm.get('minBalance')?.errors?.['required']">Balance is required.</small>
        <small *ngIf="signupForm.get('minBalance')?.errors?.['min']">Minimum balance must be 1000.</small>
      </div>
    </div>

    <button type="submit">Sign Up</button>
  </form>
</div>
