<div class="dashboard">
  <!-- Header Bar -->
  <div class="dashboard-header">
    <div class="header-content">
      <div class="header-title">Dashboard</div>
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="dashboard-content">
    <ng-container *ngIf="role === 'ROLE_ADMIN'; else userView">
      <!-- Admin View -->
      <div class="top-card">
        <h3>Good Day</h3>
        <div class="user-name">
          <div class="greeting-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          {{ username }}
        </div>
      </div>

      <div class="balance-card admin-card">
        <div class="label">Admin Dashboard</div>
        <div class="role-text">{{ role }}</div>
      </div>

      <!-- Admin Options -->
      <div class="options">
        <div class="card" (click)="goTo('/search-account')">
          <div class="card-icon-wrapper">
            <img src="assets/search.png" alt="Account Search">
          </div>
          <p>Search Account by ID</p>
        </div>
        <div class="card" (click)="goTo('/search-transactions')">
          <div class="card-icon-wrapper">
            <img src="assets/transaction.png" alt="Transactions">
          </div>
          <p>Search Transactions</p>
        </div>
      </div>

      <!-- Admin Logout Button -->
      <button class="logout-btn" (click)="logout()">
        <svg class="logout-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </ng-container>

    <ng-template #userView>
      <!-- User View -->
      <div class="top-card">
        <h3>Good Day</h3>
        <div class="user-name">
          <div class="greeting-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          {{ account?.holderName }}
        </div>
      </div>

      <div class="balance-card">
        <div class="label">Available Balance</div>
        <div class="amount">{{ account?.balance | currency:'INR':'symbol':'1.2-2' }}</div>
        <div class="account">Account {{ account?.accountId }}</div>
      </div>

      <!-- User Options -->
      <div class="options">
        <div class="card" (click)="goTo('/transfer')">
          <div class="card-icon-wrapper">
            <img src="assets/transfer.png" alt="Transfer">
          </div>
          <p>Transfer</p>
        </div>
        <div class="card" (click)="goTo('/history')">
          <div class="card-icon-wrapper">
            <img src="assets/history.png" alt="History">
          </div>
          <p>My Transactions</p>
        </div>
        <div class="card" (click)="goTo('/details')">
          <div class="card-icon-wrapper">
            <img src="assets/profile.png" alt="Details">
          </div>
          <p>My Details</p>
        </div>
        <div class="card logout-card" (click)="logout()">
          <div class="card-icon-wrapper">
            <img src="assets/logout.png" alt="Logout">
          </div>
          <p>Logout</p>
        </div>
      </div>
    </ng-template>
  </div>
</div>
